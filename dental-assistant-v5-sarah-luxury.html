<html lang="en">

<title>Lumière Dental – Assistant v5 (Sarah, luxury)</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F4;--surface:#FFFFFF;--ink:#14302F;--muted:#5E7270;--line:#DCE4E2;--brand:#14302F;--brand-ink:#F3F5F4;--gold:#B08D4F;--gold-soft:#F1E8D6;--bubble:#EAF0EE;--shadow:0 30px 80px -20px rgba(20,48,47,.35);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1716;--surface:#142423;--ink:#EDF2F0;--muted:#8FA6A3;--line:#233836;--brand:#D2B27A;--brand-ink:#14302F;--gold:#D2B27A;--gold-soft:#2A2A22;--bubble:#1B302E;--shadow:0 30px 80px -20px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--bg:#0C1716;--surface:#142423;--ink:#EDF2F0;--muted:#8FA6A3;--line:#233836;--brand:#D2B27A;--brand-ink:#14302F;--gold:#D2B27A;--gold-soft:#2A2A22;--bubble:#1B302E;--shadow:0 30px 80px -20px rgba(0,0,0,.7)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;min-height:100vh;transition:background .3s,color .3s}
/* demo backdrop */
.demo{max-width:860px;margin:0 auto;padding:48px 24px}
.demo nav{display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:600}
.tbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 16px;font:500 13px Manrope,sans-serif;cursor:pointer}
.demo h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(40px,7vw,72px);line-height:1.02;margin:90px 0 18px;max-width:14ch}
.demo p{color:var(--muted);max-width:46ch;line-height:1.65}
/* widget */
#lx{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));z-index:999;font-family:Manrope,system-ui,sans-serif}
#lx-fab{width:78px;height:78px;border-radius:50%;border:2px solid var(--gold);padding:0;background:var(--surface);cursor:pointer;box-shadow:var(--shadow);position:relative;transition:transform .25s}
#lx-fab .on{position:absolute;right:3px;bottom:3px;width:15px;height:15px;border-radius:50%;background:#5FD08F;border:2.5px solid var(--surface)}
.av{overflow:hidden;padding:0}.av svg{width:100%;height:100%;display:block}
#lx-fab:hover{transform:scale(1.06)}
#lx-fab svg{width:100%;height:100%;display:block;border-radius:50%}
#lx-fab::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--gold);opacity:0;animation:ring 2.8s ease-out 2s 3}
@keyframes ring{0%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(1.35)}}
#lx-tip{position:absolute;right:92px;bottom:22px;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:10px 14px;border-radius:14px;font-size:13px;white-space:nowrap;box-shadow:var(--shadow)}
#lx-panel{position:absolute;right:0;bottom:96px;width:390px;max-width:calc(100vw - 32px);height:600px;max-height:calc(100vh - 120px);background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;transform-origin:bottom right;opacity:0;transform:translateY(16px) scale(.96);pointer-events:none;transition:opacity .28s,transform .28s}
#lx.open #lx-panel{opacity:1;transform:none;pointer-events:auto}
#lx.open #lx-tip{display:none}
.hd{padding:20px 20px 18px;background:var(--brand);color:var(--brand-ink);display:flex;gap:14px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:var(--gold);flex:none;background:rgba(255,255,255,.06)}
.hd b{display:block;font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;line-height:1.1}
.hd small{font-size:12px;opacity:.8;display:flex;align-items:center;gap:6px;margin-top:3px}
.dot{width:7px;height:7px;border-radius:50%;background:#5FD08F}
.x{margin-left:auto;background:transparent;border:0;color:inherit;cursor:pointer;font-size:22px;opacity:.8;padding:4px 8px;border-radius:8px}
.msgs{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.m{max-width:84%;padding:12px 15px;border-radius:18px;font-size:14px;line-height:1.55;animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.m.b{background:var(--bubble);border-bottom-left-radius:6px;align-self:flex-start}
.m.u{background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:6px;align-self:flex-end}
.typing{display:flex;gap:4px;padding:14px 16px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bl 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;animation:pop .25s}
.chip{border:1px solid var(--gold);background:transparent;color:var(--ink);padding:9px 14px;border-radius:99px;font:500 13px Manrope,sans-serif;cursor:pointer;transition:background .2s}
.chip:hover{background:var(--gold-soft)}
.card{border:1px solid var(--gold);background:var(--gold-soft);border-radius:18px;padding:16px;align-self:stretch;font-size:14px;line-height:1.6}
.card h4{margin:0 0 6px;font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600}
.card a,.cta{display:inline-block;margin-top:10px;background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:12px;text-decoration:none;font-weight:600;font-size:13px;border:0;cursor:pointer;font-family:inherit}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.ft{padding:12px 14px 14px;border-top:1px solid var(--line)}
.ft form{display:flex;gap:8px}
.ft input{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px 14px;font:14px Manrope,sans-serif;outline:0}
.ft input:focus{border-color:var(--gold)}
.send{width:44px;border:0;border-radius:14px;background:var(--brand);color:var(--brand-ink);cursor:pointer;font-size:18px}
.note{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:480px){#lx-panel{position:fixed;inset:0;width:auto;max-width:none;height:auto;max-height:none;border-radius:0;transform-origin:bottom}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
#lx-fab{width:auto;height:auto;border:0;background:none;box-shadow:none;display:flex;align-items:flex-end;gap:4px;border-radius:0;padding:0;z-index:1}
#lx-fab:hover{transform:none}#lx-fab::after{content:none;animation:none}
#lx-fab svg.ch{width:96px;height:154px;border-radius:0;filter:drop-shadow(0 10px 14px rgba(0,0,0,.25));animation:bob 4s ease-in-out infinite}
#lx-fab svg.pi{width:17px;height:17px;border-radius:0}
.pill{display:flex;align-items:center;gap:9px;margin-bottom:46px;padding:12px 16px;border-radius:16px;background:#10292A;border:1px solid #B08D4F;color:#F3F5F4;font:600 14px Manrope,sans-serif;white-space:nowrap;box-shadow:0 12px 30px -8px rgba(0,0,0,.5);transition:transform .2s}
.pill b{background:#D2B27A;color:#10292A;font-size:11px;padding:3px 8px;border-radius:99px}
#lx-fab:hover .pill{transform:translateX(3px)}#lx.open .pill{display:none}
.wv{transform-origin:67px 66px;animation:wave 2.4s ease-in-out infinite}
.sp{animation:tw 2.6s ease-in-out infinite}.sp.s2{animation-delay:1.2s}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes wave{25%,75%{transform:rotate(-14deg)}50%{transform:rotate(6deg)}}
@keyframes tw{50%{opacity:.2}}
#lx-panel{right:auto;left:0;bottom:168px;transform-origin:bottom left;z-index:2;max-height:calc(100vh - 200px)}
@media (max-width:480px){#lx-panel{position:fixed;inset:0;width:auto;max-width:none;height:auto;max-height:none;border-radius:0}#lx.open #lx-fab{display:none}}
</style>
<style>
#lx-panel{border:1px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(160deg,var(--gold),transparent 38%,transparent 62%,var(--gold)) border-box}
.mic{width:44px;border:1px solid var(--gold);border-radius:14px;background:transparent;color:var(--gold);cursor:pointer;display:grid;place-items:center}
.mic svg{width:18px;height:18px}.mic[hidden]{display:none}
.mic.rec{background:var(--gold);color:var(--brand-ink);animation:mp 1s infinite}
@keyframes mp{50%{box-shadow:0 0 0 7px rgba(176,141,79,.25)}}
</style>
</head>

<script>
/* ---- Clinic settings: edit these for each client ---- */
const CLINIC={name:"Lumière Dental",phone:"+61 2 0000 0000",wa:"61400000000",hours:"Mon–Fri 8am–6pm, Sat 9am–2pm",
 aiEndpoint:"", /* paste your Worker URL here to enable free-form AI answers */
 treatments:[["Teeth whitening","$450–$900"],["Dental implant","$4,500–$6,500"],["Veneers (per tooth)","$1,200–$2,000"],["Invisalign / braces","$4,500–$9,500"],["Root canal","$900–$2,200"],["Checkup & clean","$180–$350"]]};
/* ---------------------------------------------------- */
const $=s=>document.querySelector(s),msgs=$('#msgs'),lx=$('#lx');
let booking=null,greeted=false,voiceOn=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function say(h){if(!voiceOn||!window.speechSynthesis)return;const t=h.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-AU";speechSynthesis.speak(u)}
const root=document.documentElement;
$('#theme').onclick=()=>{const dark=getComputedStyle(root).getPropertyValue('--bg').trim()==='#0C1716';root.dataset.theme=dark?'light':'dark'};
const open=v=>{lx.classList.toggle('open',v);if(v&&!greeted){greeted=true;start()}};
$('#lx-fab').onclick=()=>{const o=!lx.classList.contains('open'),first=!greeted;if(o&&SR)voiceOn=true;open(o);if(o&&!first&&voiceOn)listen()};
$('#lx-close').onclick=()=>{open(false);voiceOn=false;window.speechSynthesis&&speechSynthesis.cancel()};
const scroll=()=>setTimeout(()=>msgs.scrollTop=msgs.scrollHeight,30);
const el=(h,c)=>{const d=document.createElement('div');d.className=c;d.innerHTML=h;msgs.appendChild(d);scroll();return d};
const user=t=>{const d=el('',"m u");d.textContent=t};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function bot(h,c="m b"){const t=el('<i></i><i></i><i></i>',"m b typing");await wait(550);t.remove();const d=el(h,c);if(c==="m b")say(h);return d}
function chips(list){document.querySelectorAll('.chips').forEach(c=>c.remove());const d=el('',"chips");list.forEach(([l,fn])=>{const b=document.createElement('button');b.className='chip';b.textContent=l;b.onclick=()=>{user(l);d.remove();fn()};d.appendChild(b)})}
const menu=()=>chips([["Book an appointment",book1],["Toothache or emergency",emergency],["Treatments & prices",prices],["Opening hours",hours],["Chat on WhatsApp",wa]]);
async function start(){await bot("Welcome to "+CLINIC.name+". I’m Sarah, the virtual assistant here. I can book your visit, share treatment prices or connect you with our team. Just say what you need, or tap an option.");menu();if(voiceOn)listen()}
async function book1(){booking={};await bot("Lovely. Which treatment are you interested in?");chips([...CLINIC.treatments.map(t=>[t[0],()=>{booking.t=t[0];book2()}]),["Not sure yet",()=>{booking.t="Consultation";book2()}]])}
async function book2(){await bot("Which day suits you best?");const d=[];for(let i=1;d.length<4;i++){const x=new Date();x.setDate(x.getDate()+i);if(x.getDay()!==0)d.push(x)}
 chips(d.map(x=>[x.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}),()=>{booking.d=x.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});book3()}]))}
async function book3(){await bot("And what time? These are the open slots.");chips(["11:00 am","1:30 pm","4:00 pm","6:30 pm"].map(t=>[t,()=>{booking.time=t;book4()}]))}
async function book4(){await bot("Almost done. Please type your full name and phone number, for example: Ayesha Khan, 0300 1234567.");booking.ask=true;$('#inp').focus()}
async function confirm(info){booking.who=info;booking.ask=false;const b=booking;
 await bot(`<h4>Request received</h4><div class="row"><span>Treatment</span><b>${esc(b.t)}</b></div><div class="row"><span>Date</span><b>${esc(b.d)}</b></div><div class="row"><span>Time</span><b>${esc(b.time)}</b></div><div class="row"><span>Patient</span><b>${esc(b.who)}</b></div>We’ll send a confirmation and a reminder on WhatsApp.<br><a href="https://wa.me/${CLINIC.wa}?text=${encodeURIComponent('Hi, I booked '+b.t+' on '+b.d+' at '+b.time+'. Name: '+b.who)}" target="_blank" rel="noopener">Confirm on WhatsApp</a>`,"card");
 booking=null;chips([["Something else",menu]])}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function emergency(){await bot(`<h4>We’re here for you</h4>For severe pain, swelling, a knocked-out tooth or bleeding, call us now. We keep same-day slots for emergencies.<br><a href="tel:${CLINIC.phone.replace(/\s/g,'')}">Call ${CLINIC.phone}</a>`,"card");chips([["Book earliest slot",book1],["Back to menu",menu]])}
async function prices(){await bot('<h4>Treatment price guide</h4>'+CLINIC.treatments.map(t=>`<div class="row"><span>${t[0]}</span><b>${t[1]}</b></div>`).join('')+'<small>Final quote is given after your consultation.</small>',"card");chips([["Book a consultation",book1],["Back to menu",menu]])}
async function hours(){await bot(`We’re open <b>${CLINIC.hours}</b>. Emergencies are seen on request, any day.`);chips([["Book an appointment",book1],["Back to menu",menu]])}
async function wa(){await bot(`Our team replies on WhatsApp any time.<br><a class="cta" href="https://wa.me/${CLINIC.wa}" target="_blank" rel="noopener">Open WhatsApp</a>`);menu()}
const hist=[];
async function ai(t){
 if(CLINIC.aiEndpoint){try{const r=await fetch(CLINIC.aiEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,history:hist.slice(-8)})});const j=await r.json();if(j.reply){hist.push({role:'user',content:t},{role:'assistant',content:j.reply});await bot(esc(j.reply));return menu()}}catch(e){}}
 await bot("I can help with bookings, prices, hours and emergencies. For anything else, our team is a message away.");menu()}
function route(t){const s=t.toLowerCase();
 if(/pain|ache|swell|bleed|emergen|broken|knock/.test(s))return emergency();
 if(/book|appoint|visit|schedule/.test(s))return book1();
 if(/price|cost|fee|how much|implant|whiten|braces|veneer/.test(s))return prices();
 if(/hour|open|time|when/.test(s))return hours();
 if(/whats|human|talk|person|call/.test(s))return wa();
 ai(t)}
$('#form').onsubmit=e=>{e.preventDefault();const v=$('#inp').value.trim();if(!v)return;$('#inp').value='';user(v);booking&&booking.ask?confirm(v):route(v)};

const mic=$('#mic');
function listen(){
 if(!SR)return;
 if(window.speechSynthesis&&speechSynthesis.speaking){setTimeout(listen,400);return}
 const r=new SR();r.lang='en-AU';voiceOn=true;mic.classList.add('rec');
 r.onresult=e=>{const v=e.results[0][0].transcript;user(v);booking&&booking.ask?confirm(v):route(v)};
 r.onend=r.onerror=()=>mic.classList.remove('rec');
 try{r.start()}catch(e){mic.classList.remove('rec')}}
if(!SR)mic.hidden=true;else mic.onclick=listen;
</script>
</body>
</html>
